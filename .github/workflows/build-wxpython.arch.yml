name: Build wxPython Wheel for Arch

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      TARGET_SYSTEM: arch
      TARGET_VERSION: latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema en Arch
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            curl \
            git \
            pkgconf \
            ca-certificates \
            gtk3 \
            webkit2gtk-4.1 \
            gstreamer \
            gst-plugins-base \
            freeglut \
            libjpeg-turbo \
            libpng \
            libtiff \
            sdl2 \
            libnotify \
            libsm \
            libsecret \
            libxtst

      - name: Instalar uv (Astral)
        uses: astral-sh/setup-uv@v4

      - name: Instalar Python con uv
        run: uv python install ${{ matrix.python-version }}

      - name: Crear entorno e instalar herramientas de build
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python --upgrade pip setuptools wheel

      - name: Descargar y compilar wheel de wxPython
        run: |
          mkdir -p dist
          uv run --python .venv/bin/python python -m pip wheel wxPython --wheel-dir dist -v

      - name: Renombrar wheel para release
        run: |
          wheel_file="$(ls dist/*.whl | head -n 1)"
          [ -n "$wheel_file" ]
          cp "$wheel_file" "dist/wxPython_${GITHUB_REF_NAME}.${TARGET_SYSTEM}-${TARGET_VERSION}-python${{ matrix.python-version }}.whl"

      - name: Subir wheel como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxpython-${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 30

      - name: Publicar Release en GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: wxPython_${{ github.ref_name }}.${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}
          files: dist/wxPython_${{ github.ref_name }}.${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}.whl
          generate_release_notes: true
