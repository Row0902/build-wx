name: Build wxPython Wheel for Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      TARGET_SYSTEM: windows
      TARGET_VERSION: "2022"

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar uv (Astral)
        uses: astral-sh/setup-uv@v4

      - name: Instalar Python con uv
        run: uv python install ${{ matrix.python-version }}

      - name: Crear entorno e instalar herramientas de build
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/Scripts/python.exe --upgrade pip setuptools wheel

      - name: Descargar y compilar wheel de wxPython
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          uv run --python .venv/Scripts/python.exe python -m pip wheel wxPython --wheel-dir dist -v

      - name: Renombrar wheel para release
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel) { throw "No se generó ningún wheel" }
          $releaseName = "wxPython_${{ github.ref_name }}.${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}.whl"
          Copy-Item $wheel.FullName (Join-Path dist $releaseName)

      - name: Subir wheel como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxpython-${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 30

      - name: Publicar Release en GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: wxPython_${{ github.ref_name }}.${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}
          files: dist/wxPython_${{ github.ref_name }}.${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}.whl
          generate_release_notes: true
