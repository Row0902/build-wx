name: Build wxPython Wheel for Debian

on:
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * *'

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    env:
      TARGET_SYSTEM: debian
      TARGET_VERSION: bookworm

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Detectar última versión estable de wxPython
        id: wxpython
        run: |
          version="$(python3 -c "import json,re,urllib.request; data=json.load(urllib.request.urlopen('https://pypi.org/pypi/wxPython/json')); stable=[v for v in data['releases'].keys() if re.fullmatch(r'\\d+(?:\\.\\d+)*', v)]; stable.sort(key=lambda s: tuple(map(int,s.split('.')))); print(stable[-1] if stable else '')")"
          [ -n "$version" ]
          echo "wxpython_version=$version" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias del sistema en Debian
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            curl \
            git \
            pkg-config \
            ca-certificates \
            python3 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            freeglut3-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libsdl2-dev \
            libnotify-dev \
            libsm-dev \
            libsecret-1-dev \
            libxtst-dev

      - name: Instalar uv (Astral)
        uses: astral-sh/setup-uv@v4

      - name: Instalar Python con uv
        run: uv python install ${{ matrix.python-version }}

      - name: Crear entorno e instalar herramientas de build
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python --upgrade pip setuptools wheel

      - name: Descargar y compilar wheel de wxPython
        run: |
          mkdir -p dist
          uv run --python .venv/bin/python python -m pip wheel wxPython==${{ steps.wxpython.outputs.wxpython_version }} --wheel-dir dist -v

      - name: Renombrar wheel para release
        run: |
          wheel_file="$(ls dist/*.whl | head -n 1)"
          [ -n "$wheel_file" ]
          cp "$wheel_file" "dist/wxPython_v${{ steps.wxpython.outputs.wxpython_version }}.${TARGET_SYSTEM}-${TARGET_VERSION}-python${{ matrix.python-version }}.whl"

      - name: Subir wheel como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxpython-${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}-v${{ steps.wxpython.outputs.wxpython_version }}
          path: dist/*.whl
          retention-days: 30

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wxPython-v${{ steps.wxpython.outputs.wxpython_version }}
          name: wxPython_v${{ steps.wxpython.outputs.wxpython_version }}.${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}
          files: dist/wxPython_v${{ steps.wxpython.outputs.wxpython_version }}.${{ env.TARGET_SYSTEM }}-${{ env.TARGET_VERSION }}-python${{ matrix.python-version }}.whl
          generate_release_notes: true
          overwrite_files: true
