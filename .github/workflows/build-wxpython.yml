name: Build wxPython Wheel for Fedora

on:
  workflow_dispatch: # Permite ejecutar la Action manualmente desde la pestaña Actions
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest # Corre el entorno dentro de Fedora oficial

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Instalar dependencias del sistema en Fedora
        run: |
          dnf update -y
          dnf install -y \
            gcc-c++ \
            git \
            which \
            python3-devel \
            gtk3-devel \
            webkit2gtk4.1-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            glut-devel \
            libjpeg-turbo-devel \
            libpng-devel \
            libtiff-devel \
            SDL2-devel \
            libnotify-devel \
            libSM-devel \
            libsecret-devel \
            libXtst-devel

      - name: Instalar uv
        run: |
          dnf install -y curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Crear entorno e instalar herramientas de build
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install --upgrade pip setuptools wheel

      - name: Descargar y compilar el Wheel de wxPython
        run: |
          source .venv/bin/activate
          mkdir -p dist
          # Descarga el código fuente de wxPython y compila el .whl dentro de ./dist
          pip wheel wxPython --wheel-dir=dist -v 2>&1 | tee build.log

      - name: Subir el Wheel como Artifact de GitHub
        uses: actions/upload-artifact@v7
        with:
          name: fedora-wxpython-wheel
          path: dist/*.whl
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Artifact del wheel
        uses: actions/download-artifact@v8
        with:
          name: fedora-wxpython-wheel
          path: dist

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.whl
          generate_release_notes: true
